name: Export Cartao Plus source ZIP
on:
  push:
    branches:
      - export/cartao-plus-zip-20261111
    paths:
      - .github/workflows/export-cartao-plus.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact project revision
        uses: actions/checkout@v4
      - name: Create complete source archive
        run: git archive --format=zip --prefix=Cartao-Plus/ HEAD -o Cartao-Plus-completo.zip
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: cartao-plus-source
          path: Cartao-Plus-completo.zip
          if-no-files-found: error
          retention-days: 1
