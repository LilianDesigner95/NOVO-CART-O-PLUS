name: Validate Cartao Plus

on:
  push:
    branches: [main, 'ci/**', 'security/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cartao-plus-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, TypeScript and build (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_CF_FETCH_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Automated tests
        run: pnpm test
      - name: TypeScript
        run: pnpm typecheck
      - name: Production build (validation only)
        run: pnpm build
